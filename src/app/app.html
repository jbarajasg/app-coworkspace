<div class="min-h-dvh bg-slate-50 text-slate-900 antialiased">
  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">
      <a routerLink="/espacios" class="flex items-center gap-2.5" aria-label="CoworkSpace, inicio">
        <span
          class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-sm font-black text-white"
          aria-hidden="true"
          >C</span
        >
        <span class="text-lg font-bold tracking-tight">CoworkSpace</span>
      </a>

      <nav class="hidden items-center gap-1 md:flex" aria-label="Principal">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
            >{{ link.label }}</a
          >
        }
      </nav>

      <button
        type="button"
        class="grid size-10 place-items-center rounded-lg text-slate-600 hover:bg-slate-100 md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        aria-label="Abrir menú"
        (click)="menuOpen.set(!menuOpen())"
      >
        @if (menuOpen()) {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="size-6"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M6 6l12 12M6 18L18 6" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="size-6"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>

    @if (menuOpen()) {
      <nav
        id="mobile-menu"
        class="border-t border-slate-200 bg-white px-4 py-3 md:hidden"
        aria-label="Principal"
      >
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            (click)="menuOpen.set(false)"
            >{{ link.label }}</a
          >
        }
      </nav>
    }
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <router-outlet />
  </main>
</div>
